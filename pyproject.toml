[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "aegis1"
version = "0.1.0"
description = "Standalone, read-only Aegis1 discovery pilot"
requires-python = ">=3.9"

[project.scripts]
aegis1 = "aegis1.scripts.aegis1:main"

[tool.hatch.build.targets.wheel.force-include]
"scripts/aegis1.py" = "aegis1/scripts/aegis1.py"
"scripts/aegis1_hosts.py" = "aegis1/scripts/aegis1_hosts.py"
"agents/aegis1.md" = "aegis1/agents/aegis1.md"
"skills/system-discovery" = "aegis1/skills/system-discovery"

[tool.hatch.build.targets.sdist]
include = ["/pyproject.toml", "/README.md", "/scripts/aegis1.py", "/scripts/aegis1_hosts.py", "/agents/aegis1.md", "/skills/system-discovery"]
